[package]
name = "strata_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
# Window + input ONLY. Bevy's render feature is intentionally disabled so WE own
# the single wgpu device (strata_render's Renderer). The `bevy_*` features below
# pull in just windowing/input/log; all render-dependent plugins are cfg'd out.
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    # Rapier's physics plugin conditionally adds AssetPlugin/MeshPlugin/ScenePlugin,
    # so those crates must be compiled (they do NOT pull in bevy_render).
    "bevy_asset",
    "bevy_mesh",
    "bevy_scene",
    # The client references `bevy::render::RenderPlugin` (to disable it) and
    # `bevy::shader::{Shader, ShaderLoader}` (to register the asset itself since
    # RenderPlugin is off). These types live behind `bevy_render`, so the client
    # must enable it explicitly — previously it leaked in via strata_render's
    # `default-features = true` (now removed for modularity).
    "bevy_render",
] }
bevy_rapier3d = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = "3"

strata_core = { path = "../../crates/strata_core" }
strata_world = { path = "../../crates/strata_world" }
strata_physics = { path = "../../crates/strata_physics" }
strata_render = { path = "../../crates/strata_render" }
strata_player = { path = "../../crates/strata_player" }
strata_save = { path = "../../crates/strata_save" }
strata_storage = { path = "../../crates/strata_storage" }

# GPU + helpers for M9b surface presentation (same wgpu 27 line as strata_render).
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
pollster = "0.4"
