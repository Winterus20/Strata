[package]
name = "strata_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
# Window + input + render. Per plan 31 §1.5, Bevy's RenderPlugin is ENABLED
# (creates the single wgpu device/surface). ClientGpu borrows Bevy's
# RenderDevice/RenderQueue — no independent wgpu::Instance/Device/Surface.
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    # Required to print real system names in schedule ambiguity warnings
    # (Bevy 0.18 DebugName). Remove once ambiguities are resolved if binary
    # size matters; keep for local schedule debugging.
    "debug",
    # Rapier's physics plugin conditionally adds AssetPlugin/MeshPlugin/ScenePlugin,
    # so those crates must be compiled.
    "bevy_asset",
    "bevy_mesh",
    "bevy_scene",
    # RenderPlugin is now ENABLED (was disabled to avoid double-device conflict).
    # It creates Bevy's wgpu device/surface that ClientGpu borrows.
    "bevy_render",
] }
bevy_rapier3d = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = "3"

strata_core = { path = "../../crates/strata_core" }
strata_world = { path = "../../crates/strata_world" }
strata_physics = { path = "../../crates/strata_physics" }
strata_render = { path = "../../crates/strata_render" }
strata_player = { path = "../../crates/strata_player" }
strata_save = { path = "../../crates/strata_save" }
strata_storage = { path = "../../crates/strata_storage" }

# Sector snapshot encode + content hash on durable AppExit flush (same stack as strata_save).
postcard = { version = "1.1", features = ["alloc"] }
blake3 = { workspace = true }

# GPU helpers for M9b surface presentation (wgpu version aligned with Bevy 0.18).
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
