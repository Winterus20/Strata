name: Rust Performance Regression Check

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  benchmark:
    name: Run Engine Benchmarks
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Benchmarks (Divan)
        run: |
          cargo bench --workspace -- --json > benchmark_results.json
        # The JSON output from Divan can be compared against a baseline to detect a 5% performance regression
