# Windows: use the bundled rust-lld (lld-link) for fast linking.
# On stable Rust, `linker-features=+lld` is unstable, so we point the linker
# directly at the rust-lld.exe shipped inside the toolchain's rustlib dir.
# (rust-lld is not placed on PATH by default; `rustup component add llvm-tools`
# installs it here.) Keep this path in sync with your active toolchain.
[target.x86_64-pc-windows-msvc]
linker = "C:\\Users\\Yigit\\.rustup\\toolchains\\stable-x86_64-pc-windows-msvc\\lib\\rustlib\\x86_64-pc-windows-msvc\\bin\\rust-lld.exe"

# Linux (kept for reference; mold is faster than the default GNU linker):
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
