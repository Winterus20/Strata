[package]
name = "strata_storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core types shared across the workspace (SectorCoord, etc.).
strata_core = { path = "../strata_core" }

# Compression + integrity (plan 15).
zstd = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
fjall = { workspace = true }
tokio = { workspace = true }
moka = { workspace = true }

# Serialization for save structures (plan 15/38: postcard).
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
thiserror = "1"

# Aligned, Pod byte structs for headers (plan 15 §1.2).
bytemuck = { version = "1", features = ["derive"] }

# Async storage trait (plan 15 §1.4 / D8: single tokio runtime + priority channel).
async-trait = "0.1"
# Byte blobs stored in the WARM L2 cache (plan 15 §1.1.1 / D5).
bytes = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Unique temp-dir names for tests (Windows-compatible, no hardcoded /tmp).
uuid = { version = "1", features = ["v4"] }
