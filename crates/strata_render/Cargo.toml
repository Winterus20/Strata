[package]
name = "strata_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Render logic + GPU bootstrap. Uses wgpu directly for the Renderer; the client
# binary provides Bevy's RenderDevice/RenderQueue via the bevy_bridge module.
bevy = { workspace = true, default-features = false, features = ["bevy_log"] }
strata_core = { path = "../strata_core" }
strata_world = { path = "../strata_world" }
strata_physics = { path = "../strata_physics" }

# GPU bootstrap for M4 (wgpu bootstrap + headless offscreen clear).
# Pinned to 29.x to match the wgpu version pulled in by Bevy 0.18.
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"

# Tiny executor used only by the #[cfg(test)] GPU test to drive async
# request_adapter / request_device on the test thread.
pollster = "0.4"
thread-priority = "3.1.1"
