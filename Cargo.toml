[workspace]
resolver = "3"
members = [
    "crates/strata_core",
    "crates/strata_world",
    "crates/strata_physics",
    "crates/strata_render",
    "crates/strata_player",
    "crates/strata_storage",
    "crates/strata_save",
    "bin/client",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kilo-Org/strata"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
bevy_rapier3d = { version = "0.35", default-features = false, features = [
    "enhanced-determinism",
    "dim3",
] }

# --- Storage tier dependencies (plan 15 / M11a) ---
# Compression + integrity. zstd levels: WARM=1, DISTANT=3, ARCHIVE=19 (plan 15 §1.7).
zstd = "0.13"
# Content-addressable dedup key (plan 15 §1.3 / D8). 128-bit slice used on hot path,
# full 256-bit for durable store.
blake3 = "1.5"
# Independent frame bitrot checksum (plan 15 §1.2 / D14). Distinct algorithm from BLAKE3.
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Primary metadata store (LSM, write-heavy). plan 15 §1.5 / D1: fjall birincil, redb ikincil.
fjall = "2"
# Async I/O runtime for storage backend (single runtime + priority channel, plan 15 §1.4 / D8).
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros"] }
# WARM L2 cache, S3-FIFO eviction, byte-weighted (plan 15 §1.1.1 / D5).
moka = { version = "0.12", features = ["future"] }

[profile.dev]
opt-level = 1
debug = 1
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
lto = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
